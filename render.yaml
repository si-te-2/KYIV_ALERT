# Telegram session transfer was approved by the owner. Credentials remain only in Render.
services:
  - type: web
    name: kyiv-alert-api
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: AllowedHosts
        value: '*.onrender.com;localhost;127.0.0.1'
      - key: PublicApi__AllowedOrigin
        value: https://si-te-2.github.io
      - key: PublicApi__ReadOnly
        value: 'true'
      - key: CivilAlerts__PublicFeed
        value: 'true'
      - key: CivilAlerts__Enabled
        value: 'true'
      - key: CivilAlerts__MonitoringChannels
        value: kyiv_nebo,ppo_kiev,tlknewsua,nebo_raketa,smolii_ukraine,StrategicaviationT,ukraine_pyxx,kpszsu,war_monitor
      - key: Telegram__SessionDirectory
        value: /tmp/kyiv-alert-telegram
      - key: Telegram__SessionSeedFile
        value: /etc/secrets/telegram-session.base64
