name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: dotnet build backend/KyivAlert.Api/KyivAlert.Api.csproj --configuration Release
      - run: dotnet test backend/KyivAlert.Tests/KyivAlert.Tests.csproj --configuration Release
      - name: Verify public API Docker image
        run: |
          docker build -t kyiv-alert-api .
          docker run -d --name kyiv-alert-api -p 5087:8080 -e AllowedHosts=localhost -e PublicApi__ReadOnly=true -e PublicApi__AllowedOrigin=https://si-te-2.github.io kyiv-alert-api
          trap 'docker logs kyiv-alert-api; docker rm -f kyiv-alert-api' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://localhost:5087/api/health
          curl --fail -H 'Origin: https://si-te-2.github.io' -D "$RUNNER_TEMP/cors-headers" http://localhost:5087/api/drone-warnings
          grep -i '^Access-Control-Allow-Origin: https://si-te-2.github.io' "$RUNNER_TEMP/cors-headers"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5087/api/status)" = 404
      - name: Verify Telegram setup configuration
        shell: bash
        env:
          KYIVALERT_Telegram__ApiId: '12345'
          KYIVALERT_Telegram__ApiHash: '00000000000000000000000000000000'
        run: |
          dotnet run --project backend/KyivAlert.Telegram --configuration Release --no-build -- --check-config
          if KYIVALERT_Telegram__ApiId=0 dotnet run --project backend/KyivAlert.Telegram --configuration Release --no-build -- --check-config; then
            echo "Invalid credentials should fail validation"
            exit 1
          fi
      - name: Verify locally served application
        shell: bash
        run: |
          dotnet publish backend/KyivAlert.Api/KyivAlert.Api.csproj --configuration Release --output "$RUNNER_TEMP/kyiv-alert"
          mkdir -p "$RUNNER_TEMP/kyiv-alert/wwwroot"
          cp -R frontend/dist/. "$RUNNER_TEMP/kyiv-alert/wwwroot/"
          cd "$RUNNER_TEMP/kyiv-alert"
          dotnet KyivAlert.Api.dll > "$RUNNER_TEMP/kyiv-alert.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:5080/api/health
          curl --fail http://127.0.0.1:5080/ | grep 'KYIV ALERT'
